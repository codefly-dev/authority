name: go

# Every Go module in the repository is vetted and race-tested on each pull
# request and on main. tools/noproxygate's test is the no-proxy gate: it
# type-checks every module and refuses requests, dials and subprocesses that
# bypass host.HTTPTransport and host.DialOptions.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  modules:
    name: find Go modules
    runs-on: ubuntu-latest
    outputs:
      modules: ${{ steps.find.outputs.modules }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - id: find
        name: list every go.mod
        run: |
          modules=$(find . -name go.mod -not -path '*/node_modules/*' -printf '%h\n' | sed 's|^\./||' | sort | jq -R . | jq -cs .)
          echo "$modules"
          test "$(echo "$modules" | jq length)" -gt 0
          echo "modules=$modules" >> "$GITHUB_OUTPUT"

  test:
    name: ${{ matrix.module }}
    needs: modules
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJSON(needs.modules.outputs.modules) }}
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: ${{ matrix.module }}/go.mod
          cache-dependency-path: ${{ matrix.module }}/go.sum
      - name: go vet
        run: go vet ./...
      - name: go test -race
        run: go test -race -count=1 ./...
