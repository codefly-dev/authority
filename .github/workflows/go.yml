name: go

# Every Go module in the repository is vetted and race-tested on each pull
# request and on main. tools/noproxygate's test is the no-proxy gate: it
# type-checks every module and refuses requests, dials and subprocesses that
# bypass host.HTTPTransport and host.DialOptions.
# tools/packagegate's test is the package gate: every module a run admits
# ships its package manifest, and its contracts match what `codefly generate
# contracts` writes from the services' sources.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  modules:
    name: find Go modules
    runs-on: ubuntu-latest
    outputs:
      modules: ${{ steps.find.outputs.modules }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - id: find
        name: list every go.mod
        run: |
          modules=$(find . -name go.mod -not -path '*/.git/*' -printf '%h\n' | sed 's|^\./||' | sort | jq -R . | jq -cs .)
          echo "$modules"
          test "$(echo "$modules" | jq length)" -gt 0
          echo "modules=$modules" >> "$GITHUB_OUTPUT"

  test:
    name: ${{ matrix.module }}
    needs: modules
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJSON(needs.modules.outputs.modules) }}
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: ${{ matrix.module }}/go.mod
          cache-dependency-path: ${{ matrix.module }}/go.sum
      # The hop library's single-use admission regressions run over the real
      # transport and a real Postgres: the runner's own, started here, reached
      # over its socket as the runner's user, with no password written down.
      - name: start Postgres for the hop admission regressions
        if: matrix.module == 'libraries/hop/go'
        run: |
          sudo systemctl start postgresql.service
          sudo -u postgres createuser --superuser "$USER"
          echo "HOP_TEST_POSTGRES=host=/var/run/postgresql dbname=postgres" >> "$GITHUB_ENV"
      - name: go vet
        run: go vet ./...
      - name: go test -race
        run: go test -race -count=1 ./...

  required:
    name: Go checks
    if: always()
    needs: [modules, test]
    runs-on: ubuntu-latest
    steps:
      - name: require discovery and every module
        env:
          MODULES_RESULT: ${{ needs.modules.result }}
          TEST_RESULT: ${{ needs.test.result }}
        run: test "$MODULES_RESULT" = success && test "$TEST_RESULT" = success
