name: clients

# The authority client's Python and TypeScript readers are tested on each pull
# request and on main, beside the Go modules (go.yml): the three read the
# shared testdata/claims.json, so a reader drifting in one language fails here.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: authority-client python
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: libraries/authority-client/python
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: install
        run: python -m pip install . pytest
      - name: pytest
        run: python -m pytest -q

  typescript:
    name: authority-client typescript
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: libraries/authority-client/typescript
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: libraries/authority-client/typescript/package-lock.json
      - name: install
        run: npm ci
      - name: npm test
        run: npm test
