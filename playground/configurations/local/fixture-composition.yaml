# What this playground adds to the local authority's fixture for the modules it
# composes (services/local/README.md, "What a composition adds to the
# fixture"): nothing of its own. The document store, the record store and the
# organisation directory are reached through a role on an installation that
# reaches them; the fixture's own row seats Carol as user and Dana as admin on
# every role-gated target the run composes. No organisation role is granted a
# module's kinds (fixture-composition v2 has no roles section).
