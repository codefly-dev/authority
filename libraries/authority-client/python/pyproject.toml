[project]
name = "authority-client"
version = "0.0.1"
dependencies = ["protobuf>=5.29.3,<7", "grpcio>=1.71.0", "googleapis-common-protos", "codefly-hop @ git+https://github.com/codefly-dev/authority@cac1f6b3dcb6c9bca8a6fa7ee3f8135b8f5175ae#subdirectory=libraries/hop/python"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["authority_client", "authority_client.*"]
