[project]
name = "authority-client"
version = "0.0.1"
dependencies = ["protobuf>=5.29.3,<7", "grpcio>=1.71.0", "googleapis-common-protos"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["authority_client", "authority_client.*"]
