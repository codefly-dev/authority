[project]
name = "codefly-hop"
version = "0.1.0"
description = "The authority hop's stamp, read by a module served in Python: who a call is for, as the hop established it."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/codefly_hop"]
