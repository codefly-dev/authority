[project]
name = "codefly-hop"
version = "0.2.0"
description = "The authority hop's stamp, authenticated by a module served in Python: who a call is for, read from the verified Work Context."
requires-python = ">=3.11"
dependencies = ["authority-client"]

[project.optional-dependencies]
test = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/codefly_hop"]

# authority-client is this repository's sibling library, at the same commit:
# installing codefly-hop at commit X with uv (git+…@X#subdirectory=…) brings
# authority-client at X, with no pin of its own to keep in step.
[tool.uv.sources]
authority-client = { path = "../../authority-client/python" }
