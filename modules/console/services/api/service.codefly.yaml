name: api
version: 0.0.0
agent:
    kind: codefly:service
    name: go-grpc
    version: 0.1.60
    publisher: codefly.dev
endpoints:
    - name: grpc
    # The one face a page reaches: Connect, gRPC-Web and gRPC on one listener,
    # fronted by the hop's HTTP face.
    - name: connect
      api: connect
spec:
    Settings:
        GoAgentSettings:
            debug-symbols: false
            hot-reload: true
            race-condition-detection-run: false
            source-dir: ""
            with-cgo: false
            with-workspace: false
    connect-endpoint: true
    cors: {}
    docker-image: ""
    health:
        mode: grpc
    protocol-output-dirs: []
    protocol-source-dir: ""
    rest-endpoint: false
    runtime-assets: []
# The console reaches the authority through the interface it depends on, never a
# service: the composition resolves which implementation answers.
service-dependencies:
    - interface: codefly.dev/authority@0.1.0
# The console acts as a workload of its own: the run vouches for it and delivers
# its manifest to the authority.
module-identity: true
# The run's proof the hop writes on every stamp; the console believes a stamp
# only when it carries it.
workspace-configuration-dependencies:
    - hop
