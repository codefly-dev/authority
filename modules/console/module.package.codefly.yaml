# The console's package identity: what a run delivers as its release. The id is
# the identity codefly generate contracts derives (codefly/<module>); the version
# is the package's and moves when what it publishes moves.
schema: codefly/module-package/v1
kind: module-package
id: codefly/console
version: 0.1.0
minimum-codefly-version: ">=0.1.261-0 <1.0.0"
artifact-roots:
  - contracts
  - services
services:
  - name: api
    endpoints: [grpc, connect]
    api-contracts:
      - endpoint: grpc
        kind: protobuf
        package: console.api.v1
        path: contracts/api/api/grpc/contract.binpb
        digest: sha256:bbba08bd9842456ab2095c64351363520d91c294337e19486e12d0a23fd8ee54
      - endpoint: connect
        kind: protobuf
        package: console.api.v1
        path: contracts/api/api/connect/contract.binpb
        digest: sha256:bbba08bd9842456ab2095c64351363520d91c294337e19486e12d0a23fd8ee54
contracts:
  composition: ">=1.0.0 <2.0.0"
