kind: module
name: authority
# The local authority's grpc endpoint serves the five host interfaces it
# implements, declared under interfaces/ (installable is a solution's, not the
# host's). accounts in the host implements the same identities; a consumer
# depends on an interface, never on either service.
interface:
    endpoints:
        - service: local
          endpoint: grpc
          implements:
              - codefly.dev/artifact@0.1.0
              - codefly.dev/authority@0.3.5
              - codefly.dev/composition@0.2.0
              - codefly.dev/installation@0.4.0
              - codefly.dev/session@0.2.1
        # The REST face publishes the authority's keys as a JSON Web Key Set
        # (/.well-known/jwks.json), for a module that reads them by URL.
        - service: local
          endpoint: rest
          visibility: internal
        # The hop's gRPC face: a module's REST gateway sends its translated
        # calls here (libraries/hop RESTThroughHop), so it must be reachable.
        - service: hop
          endpoint: grpc
          visibility: internal
        # The hop's HTTP face: a module that serves HTTP (the model gateway) is
        # reached through it, by the edge and by the modules calling it.
        - service: hop
          endpoint: http
          visibility: internal
        # The edge is the browser's origin, so it is reachable from outside.
        - service: edge
          endpoint: http
          visibility: public
services:
    - name: local
    # The hop stands in front of a module and lets through only a call the
    # authority checked, stamped with who it is for. Its gRPC face is exported
    # for the modules' REST gateways; the composition puts it in their path.
    - name: hop
    # The auth gateway's role: the one origin a browser talks to. It signs a
    # person in and routes each call to the module's own HTTP face with the
    # person's Work Context; the hop checks it there.
    - name: edge
    # The authority's own Postgres: what a person created at runtime and a
    # restart must not forget — approvals today. The local authority depends on it and
    # reads its read-write connection; who exists stays the fixture.
    - name: store
