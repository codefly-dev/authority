# The authority gateway's fixture: who exists, what they hold, what is installed.
organizations:
  - id: acme
    name: Acme
  - id: globex
    name: Globex
roles:
  - organization: acme
    name: viewer
    scopes:
      - {kind: documents, actions: [read]}
      - {kind: records.records, actions: [read]}
      - {kind: records.types, actions: [read]}
      - {kind: directory.entry, actions: [read]}
      - {kind: console.identity, actions: [read]}
      # Robin: a viewer reads the conversations they own, and runs no turn.
      - {kind: robin.conversations, actions: [read]}
      # Tracing: a viewer lists the organisation's agent runs, never their text.
      - {kind: tracing.trace, actions: [list_completed, read]}
      # A viewer reads only some document collections: the directory's, and
      # every shared one. The authority answers this when asked
      # (ListResources); the token carries the kind alone. A collection's id
      # is the store's namespace, "derived" and its producer joined by a unit
      # separator (\x1f).
      - kind: documents.collection
        actions: [read]
        resources:
          - {prefix: "derived\x1fdirectory"}
          - {pattern: "shared-[a-z]+"}
  - organization: acme
    name: editor
    scopes:
      - {kind: documents, actions: [read, write]}
      - {kind: documents.collection, actions: [read]}
      - {kind: records.records, actions: [read, write]}
      - {kind: records.types, actions: [read]}
      - {kind: directory.entry, actions: [read, write]}
      # An editor invokes the model: robin's model child is the authority's to
      # grant from what the editor holds at the model, and a turn the editor
      # runs calls a profile.
      - {kind: modelservice.profiles, actions: [read, invoke]}
      # Robin: an editor runs turns and keeps their conversations.
      - {kind: robin.tasks, actions: [execute, read]}
      - {kind: robin.runs, actions: [read, start, cancel]}
      - {kind: robin.conversations, actions: [read, write, share, delete]}
      - {kind: robin.intents, actions: [read, run]}
      # Tracing: an editor reads their organisation's agent runs, text
      # included where the composition keeps it.
      - {kind: tracing.trace, actions: [list_completed, read, read_content]}
  - organization: acme
    name: admin
    scopes:
      - {kind: documents, actions: [read, write, ingest]}
      - {kind: documents.collection, actions: [read, transfer, admin]}
      # Robin: an administrator sees and changes what the intent store holds.
      - {kind: robin.intents, actions: [read, read_config, import, configure, activate]}
  - organization: globex
    name: admin
    scopes:
      - {kind: documents, actions: [read, write]}
  # The local developer: every action on every kind each composed module serves,
  # in Acme. A playground signs its person in as dev.
  - organization: acme
    name: developer
    scopes:
      - {kind: "*", actions: ["*"]}
people:
  - id: maya
    email: maya@acme.test
    fixture_token: fixture-maya
    organization: acme
    roles: [viewer]
    teams: [finance]
  - id: remi
    email: remi@acme.test
    fixture_token: fixture-remi
    organization: acme
    roles: [editor]
    teams: [engineering]
  - id: alex
    email: alex@acme.test
    fixture_token: fixture-alex
    organization: acme
    roles: [admin]
    teams: [finance, engineering]
  - id: zoe
    email: zoe@globex.test
    fixture_token: fixture-zoe
    organization: globex
    roles: [admin]
    teams: [ops]
  - id: omar
    email: omar@globex.test
    fixture_token: fixture-omar
    organization: globex
    roles: []
    teams: [ops]
  - id: dev
    email: dev@acme.test
    fixture_token: fixture-dev
    organization: acme
    roles: [developer]
    teams: [engineering]
installations:
  - organization: acme
    target: wiki
    role: viewer
    owner: alex
    teams: [finance]
  - organization: globex
    target: wiki
    role: editor
    owner: zoe
    teams: [ops]

# A model a local run supervises itself (a playground's bridge to its model
# provider) is an audience like any composed module.
modules:
  - module: model
    kinds:
      - {kind: modelservice.profiles, actions: [read, invoke]}
