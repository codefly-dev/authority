name: hop
version: 0.0.0
agent:
    kind: codefly:service
    name: go-grpc
    version: 0.1.67
    publisher: codefly.dev
endpoints:
    - name: grpc
    - name: rest
    # The hop's face for a module that serves HTTP: each request decided for
    # its published HTTP template or Connect procedure and sent to the exact
    # service endpoint Codefly resolves in hop-routes (code/work.go).
    - name: http
      api: http
spec:
    Settings:
        GoAgentSettings:
            debug-symbols: false
            hot-reload: true
            race-condition-detection-run: false
            source-dir: ""
            with-cgo: false
            with-workspace: false
    connect-endpoint: false
    cors: {}
    docker-image: ""
    health:
        mode: grpc
    protocol-output-dirs: []
    protocol-source-dir: ""
    rest-endpoint: true
    runtime-assets: []
# The hop asks the authority through the interface, never a service: the host
# the composition names in the authority group's endpoint answers (saas
# accounts, say), and the local authority when it names none (code/host.go).
service-dependencies:
    - interface: codefly.dev/authority@0.2.0
# The hop group names the modules this hop fronts (MODULES). Its signing seed
# is service-scoped hop-signing/SEED, never a workspace secret. hop-routes is generated
# by Codefly from their published API catalogs, resolved only for this hop.
workspace-configuration-dependencies:
    - hop
    - hop-routes
