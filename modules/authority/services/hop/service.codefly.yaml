name: hop
version: 0.0.0
agent:
    kind: codefly:service
    name: go-grpc
    version: 0.1.59
    publisher: codefly.dev
endpoints:
    - name: grpc
    - name: rest
    # The hop's face for a module that serves HTTP: each request decided for
    # "<VERB> <path>" and sent on to the module's HTTP_UPSTREAM, or, a Connect
    # call, for its gRPC method and on to its CONNECT_UPSTREAM (code/work.go).
    - name: http
      api: http
spec:
    Settings:
        GoAgentSettings:
            debug-symbols: false
            hot-reload: true
            race-condition-detection-run: false
            source-dir: ""
            with-cgo: false
            with-workspace: false
    connect-endpoint: false
    cors: {}
    docker-image: ""
    health:
        mode: grpc
    protocol-output-dirs: []
    protocol-source-dir: ""
    rest-endpoint: true
    runtime-assets: []
# The hop asks the authority through the interface, never a service: on a
# laptop the authority gateway answers, in a cell the host does.
service-dependencies:
    - interface: codefly.dev/authority@0.1.0
# The hop group: the run's proof, which the hop writes on every stamp so the
# module behind it believes only stamps from this run's hop, and the module the
# composition puts the hop in front of (MODULE, UPSTREAM).
workspace-configuration-dependencies:
    - hop
