# Canonical development cast. SaaS projects the Acme people and installation seats
# with scripts/render-authority-fixture.rb. Pickers are composition-specific.
organizations:
  - id: acme
    name: Acme
  - id: globex
    name: Globex
roles:
  - organization: acme
    name: admin
  - organization: globex
    name: admin
  - organization: acme
    name: platform_admin
people:
  - id: sarah
    name: Sarah Chen
    email: admin@acme.com
    fixture_token: dev-admin
    organization: acme
    roles: [admin, platform_admin]
    teams: []
  - id: alice
    name: Alice Johnson
    email: alice@acme.com
    fixture_token: dev-alice
    organization: acme
    roles: [admin]
    teams: []
  - id: dana
    name: Dana Lee
    email: dana@example.com
    fixture_token: dev-dana
    organization: acme
    roles: []
    teams: []
  - id: carol
    name: Carol Davis
    email: carol@acme.com
    fixture_token: dev-carol
    organization: acme
    roles: []
    teams: []
  - id: bob
    name: Bob Williams
    email: bob@acme.com
    fixture_token: dev-bob
    organization: acme
    roles: []
    teams: []
  - id: zoe
    name: Zoë
    email: zoe@globex.test
    fixture_token: fixture-zoe
    organization: globex
    roles: [admin]
    teams: []
# The same people on every target: a row whose target is "*" stands for every
# role-gated target the run composes, whatever the composition is, so no
# composition has to name its targets here. Each declared role of each such
# target goes to its `<target>-<role>` team, and each member joins the team of
# the role named, where the target declares that role. The row installs
# nothing: a module page is installed by composition; a solution by a composing
# workspace's row naming it (its agent role, its owner, its teams), or by an
# administrator at the edge's setup page; each is seated the moment it is
# active. Alice is the installer the row stands for at Acme, and Zoë at
# Globex: a row seats the people of its own organisation only, so neither
# organisation's row reaches the other's installations.
installations:
  - organization: acme
    target: "*"
    owner: alice
    members:
      user: [carol]
      admin: [dana]
  - organization: globex
    target: "*"
    owner: zoe
    members:
      admin: [zoe]
