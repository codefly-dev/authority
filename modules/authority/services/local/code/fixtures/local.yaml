# The local authority's fixture: who exists and which organisation roles they
# hold, in the authority's own vocabulary only. What a role holds at a module,
# which solutions are installed and which modules a run supervises itself
# belong to the composition that composes them: each composing workspace adds
# them through its fixture-composition document (services/local/README.md,
# "What a composition adds to the fixture"). The organisation, role and person
# ids below are that document's contract with every composing repository.
organizations:
  - id: acme
    name: Acme
  - id: globex
    name: Globex
teams:
  - {organization: acme, id: finance}
  - {organization: acme, id: engineering}
  - {organization: globex, id: ops}
roles:
  - organization: acme
    name: viewer
    scopes:
      # The authority console: a viewer reads who they are.
      - {kind: console.identity, actions: [read]}
  - organization: acme
    name: editor
    scopes: []
  - organization: acme
    name: admin
    scopes: []
  - organization: globex
    name: admin
    scopes: []
  # Generated from the current delivered catalog, recomputed on each delivery,
  # in Acme. A playground signs its person in as dev.
  - organization: acme
    name: developer
    generated: true
people:
  - id: no-roles
    email: no-roles@acme.test
    fixture_token: fixture-no-roles
    organization: acme
    roles: []
    teams: []
  - id: maya
    name: Maya
    email: maya@acme.test
    fixture_token: fixture-maya
    organization: acme
    roles: [viewer]
    teams: [finance]
  - id: remi
    name: Rémi
    email: remi@acme.test
    fixture_token: fixture-remi
    organization: acme
    roles: [editor]
    teams: [engineering]
  - id: alex
    name: Alex
    email: alex@acme.test
    fixture_token: fixture-alex
    organization: acme
    roles: [admin]
    teams: [finance, engineering]
  - id: zoe
    name: Zoë
    email: zoe@globex.test
    fixture_token: fixture-zoe
    organization: globex
    roles: [admin]
    teams: [ops]
  - id: omar
    name: Omar
    email: omar@globex.test
    fixture_token: fixture-omar
    organization: globex
    roles: []
    teams: [ops]
  - id: dev
    name: Developer
    email: dev@acme.test
    fixture_token: fixture-dev
    organization: acme
    roles: [developer]
    teams: [engineering]
