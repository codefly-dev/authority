# What a composition of the document store, the organisation directory and a
# wiki adds to the local authority's fixture: the wiki's installations and a
# model the run supervises itself, through the fixture-composition document a
# composing workspace supplies (state.ApplyComposition). The embedded fixture
# names none of it. The document grants no organisation role anything: who
# reaches a module is who holds a role on an installation that reaches it.
schema: codefly.dev/authority/fixture-composition/v2
installations:
  # Acme's wiki reaches finance and engineering as users; its owner installs.
  - organization: acme
    target: wiki
    role: user
    owner: alex
    teams: [finance, engineering]
  - organization: globex
    target: wiki
    role: user
    owner: zoe
    teams: [ops]

# A model a local run supervises itself (a playground's bridge to its model
# provider) is an audience like any composed module.
modules:
  - module: model
    kinds:
      - {kind: modelservice.profiles, actions: [read, invoke]}
