syntax = "proto3";
// The installation interface: what is installed at an organisation and who may
// use it. An installed solution is a principal of its organisation; its roles
// are levels on the data that principal owns, and a grant of a role is the
// access. Operations on the host, and one the solution implements, the install
// step the host calls once per installation.
package host.installation.v1;

option go_package = "gateway/pkg/gen/host/installation/v1;installationv1";

// InstallationService is implemented by the host and by the local authority.
// Install takes a solution alone, chosen by an administrator through Review
// and Install. A module, roles or not, page or not, is never installed here:
// composition installs it in every organisation where it is composed,
// holding no principal and no standing authority. Its roles, when it
// declares any, decide who may use it, through GrantRole on that composition
// installation as on a solution's.
service InstallationService {
  // Current reads only the authenticated module's own active installation,
  // in the tenant of a current parent addressed to that module. It grants no
  // artifact approval or content access and exposes no roles or grants.
  rpc Current(CurrentInstallationRequest) returns (CurrentInstallation);
  // Install composes an installation of a solution: its agent principal,
  // its root scope and the row, pending until the solution acknowledges its
  // install step, or active at once for one that declares no install
  // endpoint. A module is refused NOT_FOUND: composition installs it. On an
  // active installation, a fresh approval of a newer offer than its consent
  // approved (Installation.upgrade_available) is an upgrade: the install step
  // runs again (it converges idempotently; the host converges the closure
  // there), then the installation, active throughout, moves its consent to
  // the approved generation and its revision; its grants are kept but those
  // of a role the approved offer no longer declares. Until the upgrade, the
  // holders hold what the approved offer granted, never what the delivered
  // one asks. A fresh approval of the offer already approved is refused as
  // already installed. An install never deletes a role grant otherwise:
  // RevokeRole and an uninstall do.
  rpc Install(InstallRequest) returns (Installation);
  // Review reads the current offer and installation revision without granting consent.
  rpc Review(ReviewRequest) returns (ConsentApproval);
  // GrantRole grants a person or a team one of the roles the installation's
  // target declares (a solution's, or a module page's on its composition
  // installation): the access. Idempotent; it leaves existing capabilities
  // valid. An administrator of the installation's organization, or a holder
  // of the installer role on that installation, grants.
  rpc GrantRole(GrantRoleRequest) returns (Installation);
  // RevokeRole ends one grant; every capability its subject holds from it is
  // refused at once. Idempotent; the same callers as GrantRole.
  rpc RevokeRole(RevokeRoleRequest) returns (Installation);
  // ListRoleGrants answers who holds which role on the installation; the same
  // callers as GrantRole.
  rpc ListRoleGrants(ListRoleGrantsRequest) returns (ListRoleGrantsResponse);
  // List answers what one organisation has installed: an administrator's read.
  // A member's view, which installed solutions they may use, is ListHeld.
  rpc List(ListRequest) returns (ListResponse);
  // ListHeld answers the signed-in person which installations of their
  // organisation they may use: each active installation on which they hold a
  // role, granted to them or to a team of theirs, with the roles they hold.
  // It is their navigation and answers their own holdings alone, never who
  // else holds what. A member holding nothing reads an empty list; a caller
  // acting at another organisation is refused naming it.
  rpc ListHeld(ListHeldRequest) returns (ListHeldResponse);
}

message CurrentInstallationRequest {
  string parent_token = 1;
  string actor_credential = 2;
}

// CurrentInstallation is request-local metadata, never a lease or consent.
message CurrentInstallation {
  string id = 1;
  string organization_id = 2;
  string target = 3;
  uint64 revision = 4;
  string namespace = 5;
}

// InstallableService is implemented by a solution that declares an install
// endpoint; the host calls it once per installation and retries until it is
// acknowledged. A solution without it is active as soon as its installation
// is recorded.
service InstallableService {
  // Install sets up the solution for one installation; it must converge.
  rpc Install(InstallationNotice) returns (InstallationAck);
}

// OfferService is the local authority's setup read, served beside
// InstallationService and not part of codefly.dev/installation: what targets
// this run delivered that an administrator chooses and, for one, what
// installing it would grant. A host answers its own product's reads. It
// grants nothing; Install, GrantRole and RevokeRole stay the only changes,
// each decided by the authority.
service OfferService {
  // ListOffers lists the solutions delivered to this run that an
  // administrator of the organization may install. A module, roles or not,
  // is installed by composition and is never offered.
  rpc ListOffers(ListOffersRequest) returns (ListOffersResponse);
  // ReviewOffer reads one target's roles, what each grants and the tools
  // those grants make eligible, with the consent Install takes, from one read
  // of the authority: the approval names exactly the offer displayed. A
  // member holding a role on the target's installation reads the same
  // without the consent.
  rpc ReviewOffer(ReviewRequest) returns (ReviewedOffer);
}

// InstallRequest asks to install one target at one organisation.
message InstallRequest {
  // The organisation installing.
  string organization_id = 1;
  // The solution installed, by its name in the composition.
  string target = 2;
  // The role the installation holds; the least privilege it needs.
  string role = 3;
  // The accountable person; an administrator of the organisation.
  string owner_person_id = 4;
  // Required: the exact offer reviewed by the administrator; unchanged on retry.
  ConsentApproval approval = 5;
}

// ReviewRequest names the offer an administrator intends to review.
message ReviewRequest {
  string organization_id = 1;
  string target = 2;
}

// ConsentApproval binds consent to an immutable target, its reviewed delivery and
// the installation revision (zero if absent). Review leaves operation_id empty;
// the caller supplies a fresh UUID and preserves the entire request on retry.
message ConsentApproval {
  string target_id = 1;
  uint64 generation = 2;
  uint64 expected_revision = 3;
  string operation_id = 4;
  // sha256 digest of the reviewed authority offer.
  string digest = 5;
  // sha256 digest of what each of the target's roles reaches, directly and
  // transitively, in the composition reviewed (ReviewedOffer roles' reach):
  // the consent covers it. Required; Install refuses an approval whose reach
  // changed since it was reviewed (INSTALLATION_APPROVAL_REACH_CHANGED).
  string reach_digest = 6;
}

// GrantRoleRequest grants one role to exactly one person or team.
message GrantRoleRequest {
  // The organization the installation belongs to; a request naming another
  // organization's installation is refused naming the organization, before
  // the caller's authority is read.
  string organization_id = 1;
  // The installation.
  string installation_id = 2;
  // One of the roles the solution declares.
  string role = 3;
  // The person granted, a member of the organization; exactly one of
  // person_id and team_id is set.
  string person_id = 4;
  // The team granted, a team of the organization.
  string team_id = 5;
}

// RevokeRoleRequest ends one grant, named as GrantRole named it.
message RevokeRoleRequest {
  // The organization the installation belongs to.
  string organization_id = 1;
  // The installation.
  string installation_id = 2;
  // The role.
  string role = 3;
  // The person; exactly one of person_id and team_id is set.
  string person_id = 4;
  // The team.
  string team_id = 5;
}

// ListRoleGrantsRequest names one installation.
message ListRoleGrantsRequest {
  // The organization the installation belongs to.
  string organization_id = 1;
  // The installation.
  string installation_id = 2;
}

// ListRoleGrantsResponse is every grant on the installation.
message ListRoleGrantsResponse {
  // The grants.
  repeated RoleGrant grants = 1;
}

// RoleGrant is one role held by one person or team.
message RoleGrant {
  // The role.
  string role = 1;
  // The person, when a person holds it.
  string person_id = 2;
  // The team, when a team holds it.
  string team_id = 3;
}

// ListRequest asks for one organisation's installations.
message ListRequest {
  // The organisation.
  string organization_id = 1;
}

// ListResponse lists installations.
message ListResponse {
  // The installations.
  repeated Installation installations = 1;
}

// Installation is one organisation's installation of one target.
message Installation {
  // The installation id.
  string id = 1;
  // The organisation.
  string organization_id = 2;
  // The target installed.
  string target = 3;
  // Where the installation stands.
  Status status = 4;
  // Bumped on every change that narrows or widens the installation.
  uint64 revision = 5;
  // The role the installation holds when it acts for itself (its agent's
  // role); no person or team inherits it.
  string role = 6;
  reserved 7, 8;
  reserved "team_ids", "agent_principal_id";
  // The namespace the installation's own authored content belongs to (an
  // agent's source): the host names it, so a module never chooses which source
  // an installation may run. A module installed by composition is
  // "<organization>.<target>".
  string namespace = 9;
  // The solution principal: the identity the installation's data is owned by
  // and the installation acts as for itself, a stable UUID per organization
  // and target, reused by a reinstall. Empty for a module installation.
  string principal_id = 10;
  // The roles the solution declares, sorted.
  repeated string roles = 11;
  // The delivery generation the installation's consent approved. A
  // redelivery that asks nothing new of the organization (no role, binding,
  // edge dependency or method added, none reaching further, no standing
  // authority asked) advances it without a click; one that asks more leaves
  // it. Zero for an installation installed without consent (by composition
  // or by the host's own setup).
  uint64 approved_generation = 12;
  // True when the delivered generation asks more than approved_generation
  // did, when what the roles reach in the composition now (a module the
  // target reaches redelivered, or newly composed) asks more than the
  // consent approved, or when the approved generation is unknown (a consent
  // recorded before it was kept; one recorded before reach was kept adopts
  // the reach it has once, and asks nothing for it): the installation
  // stands, active with its grants, its holders and its agent holding what
  // the approved offer and reach granted, until an administrator reviews the
  // offer and approves it with Install. A host renders it as an update
  // available.
  bool upgrade_available = 13;

  // Status is the installation's lifecycle.
  enum Status {
    // Unset.
    STATUS_UNSPECIFIED = 0;
    // Installed; the install step has not been acknowledged.
    STATUS_PENDING = 1;
    // Usable.
    STATUS_ACTIVE = 2;
    // Uninstalled; every capability sealed to it is refused.
    STATUS_REVOKED = 3;
  }
}

// InstallationNotice is what the host hands the solution's install step.
message InstallationNotice {
  // The installation being set up.
  Installation installation = 1;
}

// InstallationAck acknowledges the install step.
message InstallationAck {}

// ListOffersRequest names the organization whose administrator reads.
message ListOffersRequest {
  string organization_id = 1;
}

// ListOffersResponse is every delivered target an administrator chooses, by name.
message ListOffersResponse {
  repeated Offer offers = 1;
}

// Offer is one delivered target an administrator chooses.
message Offer {
  // The target's name in the composition: Install's target.
  string target = 1;
  // The delivery generation an approval binds.
  uint64 generation = 2;
}

// ReviewedOffer is one target's authority offer and the consent that names it.
message ReviewedOffer {
  // What Install takes, with a fresh operation_id; read with the rest.
  ConsentApproval approval = 1;
  string target = 2;
  // Each role the solution declares, the installer role included. Every role
  // scope is confined to this installation: to what it owns, or to the
  // resources attached to it.
  repeated OfferRole roles = 3;
  // The solution's own installation at the organization; absent before Install.
  Installation installation = 4;
  // The permission ceiling: each module the solution calls, and the most it
  // may ask there. No role reaches beyond it.
  repeated OfferBinding ceiling = 5;
  // False when this run delivered no prepared Runnable bindings: no tool is
  // shown, which says nothing about what a composed binding would expose.
  bool tools_composed = 6;
  // Signed machine-role selector: empty is undeclared, "none" is no standing
  // authority, otherwise a named role. This is not a person or team grant.
  string installation_role = 7;
  // Exact declared viewer-edge presence, covered by the reviewed digest.
  // Required access and per-module approval are separate host review concerns.
  repeated OfferDependency edge_dependencies = 8;
  // True when the solution declares roles, which its Setup grants.
  bool roles_declared = 9;
  // True when the solution declares a page a person opens, as the
  // authority's stored declaration knows it; a host whose store does not
  // keep the flag answers false.
  bool page = 10;
  // What the solution depends on: every module it reaches through its
  // bindings and required edge dependencies, transitively, roles or not, by
  // its name in the composition, sorted. Composition installs every module
  // wherever it is composed; a host whose composition is per organisation
  // converges these with the install. A solution reached is installed by its
  // own review and is not listed. A binding audience or a required edge
  // dependency that is not composed refuses the review: the closure cannot
  // be installed.
  repeated string closure = 11;
  // The optional edge dependencies the target and its closure declare, by
  // module name: present when composed, never installed with the target.
  repeated string optional_edges = 12;
}

// OfferDependency carries presence only, never scopes or inferred binding ids.
// Module is the exact signed principal, resolved by the host to its live target.
message OfferDependency {
  string module = 1;
  string presence = 2;
}

// OfferBinding is one declared call from the solution to a module.
message OfferBinding {
  string binding = 1;
  // The module called.
  string module = 2;
  repeated OfferScope scopes = 3;
}

// OfferRole is one declared role and what a grant of it reaches.
message OfferRole {
  string name = 1;
  // The scopes the role declares.
  repeated OfferScope scopes = 2;
  // Each composed operation the role's scopes cover.
  repeated OfferCapability capabilities = 3;
  // Every place a holder of the role can cause an operation, as a static
  // maximum: on the target, through the target's bindings and onward, and
  // on the holder's own session. An administrator's review reads it in the
  // composition now; a holder's, as the installation's consent approved it.
  repeated OfferReach reach = 4;
}

// OfferReach is one module a role reaches, one way. Issuance, for a holder
// or for the installation's agent, never carries past it; it is an upper
// bound (resources and owners are checked at each call).
message OfferReach {
  // A shortest way from the target to module, by module name, the target
  // first: a witness. Every way there, re-entries included, is accounted for
  // in scopes and operations.
  repeated string path = 1;
  string module = 2;
  // "role": the role's own scopes on the target; "binding": the target, then
  // each module on the path, acting for the holder; "person": an edge the
  // target's page calls on the holder's own session, where the holder's own
  // grants decide (no scopes, no operations).
  string via = 3;
  // The most a holder's capability at module can carry.
  repeated OfferScope scopes = 4;
  // On the target: "installation" (the installation's own data) or
  // "attached" (what is attached to it); empty otherwise.
  string confinement = 5;
  // The operations of module those scopes are admitted to, by its declared
  // method policies; one per operation, whatever face serves it.
  repeated string operations = 6;
}

// OfferScope is one declared scope.
message OfferScope {
  string resource_kind = 1;
  repeated string actions = 2;
  // True when the scope reaches only the resources attached to the
  // installation, listed in resource_ids (none until one is attached); false
  // when it reaches every resource the installation owns.
  bool attached_only = 3;
  repeated string resource_ids = 4;
}

// OfferCapability is one module operation a role's scopes cover.
message OfferCapability {
  string module = 1;
  // The operation as the module's authority document names it.
  string operation = 2;
  // What a call to it must hold.
  repeated OfferScope requires = 3;
  // The tools composed for this operation, from its prepared Runnable
  // bindings; empty when no binding exposes it as a tool.
  repeated OfferTool tools = 4;
}

// OfferTool is one tool-exposed Runnable of an operation.
message OfferTool {
  // The tool's name, as its exposure declares it.
  string name = 1;
  // The prepared binding a caller names to run it.
  string binding = 2;
  // True when the tool changes data.
  bool write = 3;
}

// ListHeldRequest names the organisation the person reads at: the one their
// session was opened at.
message ListHeldRequest {
  // The organisation.
  string organization_id = 1;
}

// ListHeldResponse is every installation the person holds a role on, sorted
// by installation id.
message ListHeldResponse {
  // The installations.
  repeated HeldInstallation installations = 1;
}

// HeldInstallation is one installation the person may use.
message HeldInstallation {
  // The installation.
  Installation installation = 1;
  // The roles the person holds on it, directly or through a team, sorted.
  repeated string roles = 2;
}
