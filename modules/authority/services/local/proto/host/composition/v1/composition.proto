syntax = "proto3";
// The composition interface: how the host learns what is composed. One
// operation. The render produces a manifest per module instance; the host
// derives from it the module's principal, its ceilings and its bindings. There
// is no envelope: the ceiling is the manifest.
package host.composition.v1;

option go_package = "gateway/pkg/gen/host/composition/v1;compositionv1";

import "host/authority/v1/work_context.proto";

// CompositionService is implemented by the host and by the local authority.
service CompositionService {
  // ApplyManifest delivers one module instance's manifest at one generation.
  rpc ApplyManifest(ApplyManifestRequest) returns (ApplyManifestResponse);
}

// ApplyManifestRequest carries the manifest.
message ApplyManifestRequest {
  // The sketch of a manifest, kept through the transition. An implementation
  // that verifies deliveries ignores it when a carrier is present.
  ModuleManifestV1 manifest = 1;
  // The delivery as Codefly signs it: core's module manifest and the DSSE
  // envelope over it. An implementation verifies the envelope against the release
  // keys it pins and reads the manifest from the verified document, never from
  // the request, so what composes a module is the same signed document on the
  // local authority and on the host.
  SignedManifestV1 carrier = 2;
  // The credential of the workload delivering the manifest, as that
  // implementation attests workloads: the launcher's on the local authority, the
  // delivery service account's on the host. A manifest is delivered by its own
  // module's delivery workload and by nothing else.
  string credential = 3;
  // The authority's own document for this delivery, an AuthorityManifestV1:
  // what the module declares that the authority enforces and core's manifest
  // does not carry. Signed in the same envelope format by the same key as
  // carrier, and naming carrier's digest. Absent means the module declares no
  // method policy, and every Check that names one of its methods is refused.
  SignedManifestV1 authority = 4;
}

// AuthorityManifestV1 is the authority's document for one delivery.
message AuthorityManifestV1 {
  // The module, as the core manifest it travels with names it.
  string module = 1;
  // The generation, equal to that core manifest's.
  uint64 generation = 2;
  // "sha256:<hex>" of the core manifest document delivered with it.
  string core_manifest_digest = 3;
  // Every method the module's published contracts serve, with what each
  // declares. A method that declares nothing is listed with neither field set.
  repeated MethodPolicyV1 methods = 4;
  // The module's own resource kinds with the actions its contract declares on
  // each (its scope ceilings). Core's manifest names the kinds alone, so without
  // these a kind serves any action and a person's ask for everything they hold
  // there cannot be enumerated. Each names a kind core's manifest declares.
  repeated host.authority.v1.WorkScopeV1 scope_ceilings = 5;
  // The roles a solution declares a person may hold on an installation of it,
  // as ModuleManifestV1.roles declares them through the sketch: each within
  // the solution's own scope ceilings or explicit invoke/lookup binding scopes,
  // one of them installer. Headless-only scopes cannot supply a role grant.
  // Core's manifest carries no roles, so they travel here until it does. A
  // module declares none; a module's delivery listing any is refused.
  repeated RoleV1 roles = 6;
  // The module checks a resource's owner against an owner-selected scope
  // (Claims.AllowsOwned): only an audience declaring it receives one, and a
  // delivery withdrawing it refuses the owner-selected capabilities issued
  // before. Every solution receiving its roles' scopes declares it.
  bool owner_aware = 7;
  // Core-validated selector, carried verbatim: empty is legacy caller selection,
  // "none" declares no standing machine authority, otherwise a declared role.
  string installation_role = 8;
  // Viewer-edge presence only; grants no authority. Nil and empty are equivalent.
  repeated EdgeDependencyV1 edge_dependencies = 9;
}

// EdgeDependencyV1 names the exact signed module principal. The host resolves
// it to a live catalogue target; it is not a target UUID, route alias or binding id.
message EdgeDependencyV1 {
  string module = 1;
  // Core validates required or optional; delivery does not default this value.
  string presence = 2;
}

// MethodPolicyV1 is what a call to one method must hold, as the module's
// contract declares it with the authority.hop.v1.policy option.
message MethodPolicyV1 {
  // The method: "/package.Service/Method" for a gRPC method, or an HTTP route
  // "<VERB> <template>" (GET /v1/model/profiles/{ref}), each "{name}" standing
  // for one path segment's text.
  string method = 1;
  // Each action on each kind the call must hold.
  repeated host.authority.v1.WorkScopeV1 requires = 2;
  // The method asks nothing beyond a Work Context the authority checked.
  bool any_checked_caller = 3;
}

// SignedManifestV1 is core's signed carrier: the manifest document (JSON) and
// the DSSE envelope whose payload is that document.
message SignedManifestV1 {
  bytes document = 1;
  bytes envelope = 2;
}

// ApplyManifestResponse says what the host derived.
message ApplyManifestResponse {
  // The module principal the host now knows.
  string principal = 1;
  // The generation applied.
  uint64 generation = 2;
  // The ids of the module's installations the host holds, one per organisation.
  repeated string installation_ids = 3;
}

// ModuleManifestV1 is one module instance at one generation.
message ModuleManifestV1 {
  // The module's name in the composition.
  string module = 1;
  // The module's principal; the audience of every capability addressed to it.
  string principal = 2;
  // "module" or "solution".
  string kind = 3;
  // Strictly increasing per module; a lower or equal generation is refused.
  uint64 generation = 4;
  // The module's permission to call other modules.
  repeated BindingV1 bindings = 5;
  // The resource kinds and actions the module's content is governed by.
  repeated ResourceKindV1 resource_kinds = 6;
  // The page the module contributes, if any.
  PageV1 page = 7;
  // The roles a solution declares a person may hold on an installation of it,
  // each within what the solution serves or explicitly consumes through
  // invoke/lookup bindings; one is named installer, held only by whom it is granted to.
  // Headless-only scopes cannot supply a role grant. A module declares none.
  repeated RoleV1 roles = 8;
}

// RoleV1 is one role a solution declares.
message RoleV1 {
  string name = 1;
  repeated host.authority.v1.WorkScopeV1 scopes = 2;
  // Scopes the role grants only on the resources the installation owns: those
  // created through it (AuthorityService.AttachResource) or transferred after
  // AuthorityService.AuthorizeTransfer authorizes the change of owner. Each
  // names a kind and actions and no resource ids, since ids are per
  // installation, and is held to the same ceiling as scopes. The authority
  // resolves each, for the installation the role is held on, into the same
  // scope limited to the ids that installation owns of the kind; a kind it owns
  // nothing of grants nothing, and never the whole kind.
  repeated host.authority.v1.WorkScopeV1 installation_owned_scopes = 3;
}

// BindingV1 is one declared call towards another module.
message BindingV1 {
  // The binding's name, unique within the module.
  string id = 1;
  // The principal of the module called.
  string audience = 2;
  // What the binding may do for a person.
  repeated host.authority.v1.WorkScopeV1 invoke_scopes = 3;
  // What the binding may do for the module itself: within invoke_scopes when the
  // binding declares any, and standing alone for a binding that exists only for
  // the module's own work.
  repeated host.authority.v1.WorkScopeV1 headless_scopes = 4;
  // What a receipt lookup through the binding may read; within invoke_scopes
  // when the binding declares any, else within headless_scopes.
  repeated host.authority.v1.WorkScopeV1 lookup_scopes = 5;
}

// ResourceKindV1 is one kind the module governs and the actions on it.
message ResourceKindV1 {
  // The resource kind.
  string kind = 1;
  // The actions, sorted.
  repeated string actions = 2;
}

// PageV1 is a module's frontend contribution.
message PageV1 {
  // The title shown in navigation.
  string title = 1;
  // The sort order among pages.
  int32 order = 2;
}
