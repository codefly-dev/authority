name: local
version: 0.0.0
agent:
    kind: codefly:service
    name: go-grpc
    version: 0.1.59
    publisher: codefly.dev
# The authority's own store, where approvals persist (code/pkg/infra/postgres).
# Declared, so a run starts the store first and delivers its read-write
# connection as this service's `store` postgres/read-write-connection secret.
# A run that composes no store delivers none, and the local authority keeps approvals in
# memory, saying so at boot (code/work.go approvalsFor).
# federation: the host coordinate a signed delivery is checked against.
# fixture-composition: what the composing workspace adds to the fixture (grants
# on its roles at the modules it composes, installations of its solutions,
# stand-in modules); this module ships an empty default under
# configurations/local, which a composition's own document replaces whole
# (code/work.go applyComposition).
workspace-configuration-dependencies:
    - federation
    - fixture-composition
service-dependencies:
    - name: store
      module: authority
      endpoints:
        - name: tcp
endpoints:
    - name: grpc
    - name: rest
spec:
    Settings:
        GoAgentSettings:
            debug-symbols: false
            hot-reload: true
            race-condition-detection-run: false
            source-dir: ""
            with-cgo: false
            with-workspace: false
    connect-endpoint: false
    cors: {}
    docker-image: ""
    health:
        mode: grpc
    protocol-output-dirs: []
    protocol-source-dir: ""
    rest-endpoint: true
    runtime-assets: []
