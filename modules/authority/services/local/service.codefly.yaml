name: local
version: 0.1.0
agent:
    kind: codefly:service
    name: go-grpc
    version: 0.1.67
    publisher: codefly.dev
# The authority's own store, where approvals persist (code/pkg/infra/postgres).
# Declared, so a run starts the store first and delivers its read-write
# connection as this service's `store` postgres/read-write-connection secret.
# A run that composes no store delivers none, and the local authority keeps approvals in
# memory, saying so at boot (code/work.go approvalsFor).
# federation: the host coordinate a signed delivery is checked against.
# fixture-composition: what the composition adds to the fixture (grants on its
# roles at the modules it composes, installations of its solutions, stand-in
# modules), merged by the run from every composed module's fragment
# (libraries/fixture-composition; code/work.go applyComposition).
# Keys publishes the hop's admission key once the hop registers it over its
# workload credential (RegisterAdmissionKey): nothing about the hop is
# configured here, its seed never leaves it, and a run with no hop publishes none.
workspace-configuration-dependencies:
    - federation
    - fixture-composition
service-dependencies:
    - name: store
      module: authority
      endpoints:
        - name: tcp
endpoints:
    - name: grpc
    - name: rest
spec:
    Settings:
        GoAgentSettings:
            debug-symbols: false
            hot-reload: true
            race-condition-detection-run: false
            source-dir: ""
            with-cgo: false
            with-workspace: false
    connect-endpoint: false
    cors: {}
    docker-image: ""
    health:
        mode: grpc
    protocol-output-dirs: []
    protocol-source-dir: ""
    rest-endpoint: true
    runtime-assets: []
