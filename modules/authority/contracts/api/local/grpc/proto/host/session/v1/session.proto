syntax = "proto3";
// The session interface, at the browser edge: a person signs in and the host
// opens a session, and a page's runtime asks who the bearer a request carries is.
// The local authority signs in fixture people; the host signs in real ones. A
// module never calls this: it is called through the hop.
package host.session.v1;

import "google/api/annotations.proto";

option go_package = "gateway/pkg/gen/host/session/v1;sessionv1";

// SessionService opens sessions.
service SessionService {
  // SignIn opens a session for a fixture person by their fixture token.
  rpc SignIn(SignInRequest) returns (Session) {
    option (google.api.http) = {post: "/v1/session:sign-in" body: "*"};
  }
  // Current answers the session the caller's bearer (`authorization: Bearer
  // <bearer>`) belongs to: who a page's request is for, decided by the host,
  // never read from a header the request wrote. The bearer itself is not
  // handed back. An unknown or ended session is unauthenticated.
  rpc Current(CurrentRequest) returns (Session) {
    option (google.api.http) = {get: "/v1/session"};
  }
  // OpenRoleView opens a session that acts as some of the roles the caller
  // holds on one installation: a role view. The caller's bearer is the session
  // it is opened from. The host records the view, decided by the authority, as
  // the session's own; a client never supplies it. A view only narrows: it names
  // roles the calling session acts as now, so a viewing session opens only
  // narrower ones, and a role view on one installation reaches no other. The
  // session it was opened from is untouched and stays the way back to all of the
  // person's roles. A page, a Work Context, an impersonated session and a
  // client's delegated credential hold no session of a person to call from and
  // are refused.
  rpc OpenRoleView(OpenRoleViewRequest) returns (Session) {
    option (google.api.http) = {post: "/v1/session:open-role-view" body: "*"};
  }
  // OpenTeamCast opens a session that acts as a member of one team and of
  // nothing else: a cast. It holds that team's grants and none of the caller's
  // own: no direct grant, no other team, no organisation role, no platform
  // role, so it answers what a member of the team sees. The caller's bearer is
  // the session it is opened from. The authority decides, by one rule: a person
  // may act as a team whose roles they could grant, member of it or not. A team
  // that holds roles the caller could not grant is refused saying so, and a
  // team granted nothing is not found, because there is nothing to act as. A
  // cast is never changed or widened, and a session that is already a cast
  // opens no other; a role view opened from it stays in it. The session it was
  // opened from is untouched and is the way back. The callers OpenRoleView
  // refuses are refused here.
  rpc OpenTeamCast(OpenTeamCastRequest) returns (Session) {
    option (google.api.http) = {post: "/v1/session:open-team-cast" body: "*"};
  }
  // ListCastableTeams answers the teams of the organisation the caller is
  // signed into that the caller may act as now, each with what it holds, so a
  // page offers the choice OpenTeamCast decides: listed by OpenTeamCast's one
  // rule (a team whose roles the caller could grant, member of it or not), and
  // a team it would refuse is not listed, a team granted nothing included. A
  // cast answers the one team it acts as. Listing opens nothing: each
  // OpenTeamCast is decided again when it is asked. The callers OpenTeamCast
  // refuses are refused here.
  rpc ListCastableTeams(ListCastableTeamsRequest) returns (ListCastableTeamsResponse) {
    option (google.api.http) = {get: "/v1/session/castable-teams"};
  }
  // ListFixturePeople answers who this authority signs in by fixture token, for
  // the browser edge's sign-in page: the people are defined once, in the
  // authority's fixture. A host that signs real people in through its identity
  // provider has no fixture people and answers none.
  rpc ListFixturePeople(ListFixturePeopleRequest) returns (ListFixturePeopleResponse) {
    option (google.api.http) = {get: "/v1/session/fixture-people"};
  }
}

// ListCastableTeamsRequest asks for the teams the caller may act as, at the
// organisation the caller's session is signed into.
message ListCastableTeamsRequest {}

// ListCastableTeamsResponse is every team the caller may act as, by team id.
message ListCastableTeamsResponse {
  // The teams.
  repeated CastableTeam teams = 1;
}

// CastableTeam is one team a caller may act as, and what a cast onto it holds.
message CastableTeam {
  // The team.
  string team_id = 1;
  // The team's name, as the host spells it, for a page that offers the
  // choice; the id above is the identity. A host that names teams by their
  // id answers the id.
  string display_name = 2;
  // Each role granted to the team on an active installation, by installation
  // then role.
  repeated TeamHolding holds = 3;
}

// TeamHolding is one role a team holds on one installation.
message TeamHolding {
  // The installation.
  string installation_id = 1;
  // What it installs, as the installation names it.
  string target = 2;
  // The role.
  string role = 3;
}

// ListFixturePeopleRequest asks for every fixture person.
message ListFixturePeopleRequest {}

// ListFixturePeopleResponse is every fixture person, in the fixture's order.
message ListFixturePeopleResponse {
  // The people.
  repeated FixturePerson people = 1;
}

// FixturePerson is one person a fixture run signs in.
message FixturePerson {
  // The person.
  string person_id = 1;
  // Their email.
  string email = 2;
  // The organisation they sign into.
  string organization_id = 3;
  // The roles they hold in it.
  repeated string roles = 4;
  // The teams they belong to.
  repeated string team_ids = 5;
  // The token SignIn takes for them.
  string fixture_token = 6;
  // The organisation's name, as the fixture spells it, for a page that shows
  // a person where they sign into; the id above is the identity.
  string organization_display_name = 7;
}

// OpenRoleViewRequest names the installation and the roles to act as on it.
message OpenRoleViewRequest {
  // The installation, of the organisation the caller is signed into.
  string installation_id = 1;
  // The roles to act as, each one the caller acts as on it now; at least one.
  repeated string roles = 2;
}

// OpenTeamCastRequest names the team to act as.
message OpenTeamCastRequest {
  // The team, of the organisation the caller is signed into.
  string team_id = 1;
}

// RoleViewEntry is the roles a session acts as on one installation.
message RoleViewEntry {
  // The installation.
  string installation_id = 1;
  // The roles acted as there, sorted.
  repeated string roles = 2;
}

// CurrentRequest asks for the caller's own session; the bearer is the call's.
message CurrentRequest {}

// SignInRequest presents a fixture token.
message SignInRequest {
  // The person's fixture token.
  string fixture_token = 1;
}

// Session is an open session.
message Session {
  // The session id a person-owned Issue names.
  string session_id = 1;
  // The person.
  string person_id = 2;
  // The organisation signed into.
  string organization_id = 3;
  // The roles held in it.
  repeated string roles = 4;
  // The teams belonged to.
  repeated string team_ids = 5;
  // The credential the person presents on every call as `authorization: Bearer
  // <bearer>`; whatever this implementation authenticates a person by. The local
  // authority hands back the session id; the host hands back its access token.
  string bearer = 6;
  // The person's display name, for the browser session surface.
  string person_display_name = 7;
  // The signed-in organisation's display name.
  string organization_display_name = 8;
  // The role view this session was opened with, by installation: it acts as
  // these roles there and as every role it holds elsewhere. Empty for a session
  // that is not a role view.
  repeated RoleViewEntry role_view = 9;
  // The team this session was cast onto: it acts as a member of that team and
  // of nothing else, so `roles` is empty and `team_ids` names this team alone.
  // Empty for a session that is not a cast.
  string cast_team_id = 10;
}
