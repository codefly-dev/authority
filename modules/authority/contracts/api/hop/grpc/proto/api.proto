syntax = "proto3";
package api;

// Keep the Go import path stable while the protobuf package remains free to
// evolve into a versioned wire namespace (for example coordination.v1).
option go_package = "hop/pkg/gen;gen";

import "authority/hop/v1/policy.proto";
import "google/api/annotations.proto";

message VersionRequest {
}

message VersionResponse {
    string version = 1;
}

service HopService {
    // Version is the hop's own method. A caller the authority checked may read
    // it; the hop serves it without a scope, as the console serves its Version.
    rpc Version(VersionRequest) returns (VersionResponse) {
        option (authority.hop.v1.policy) = {any_checked_caller: true};
        option (google.api.http) = {
            get: "/version"
        };
    }
}
