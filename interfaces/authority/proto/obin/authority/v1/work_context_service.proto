syntax = "proto3";
// Extracted from the host (codefly-dev/module-saas-starter,
// saas/accounts/v1/work_contexts.proto) on 2026-10-21 with messages, fields and
// field numbers unchanged. The host's method-policy options are not part of the
// interface: exposure, tenancy, audit and rate limits are how one implementation
// guards the operation, not what a caller is promised. The interface declaration
// (../../interface.codefly.yaml) names the methods a module or solution relies on.

package obin.authority.v1;

option go_package = "github.com/obin-ai/authority/gen/go/obin/authority/v1;authorityv1";

import "buf/validate/validate.proto";
import "google/api/annotations.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";

// WorkContextReplayPolicy controls how a consumer may accept a signed Work
// Context. Single-use still requires a durable replay store at the consumer.
enum WorkContextReplayPolicy {
  WORK_CONTEXT_REPLAY_POLICY_UNSPECIFIED = 0;
  WORK_CONTEXT_REPLAY_POLICY_IDEMPOTENT = 1;
  WORK_CONTEXT_REPLAY_POLICY_SINGLE_USE = 2;
}

// WorkContextScope is one product-neutral authority slice. Product plugins
// contribute the resource/action vocabulary through Accounts RBAC; this API
// does not carry a built-in list of product permissions.
message WorkContextScope {
  string resource_kind = 1 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 128
  ];
  repeated string actions = 2 [
    (buf.validate.field).repeated.min_items = 1,
    (buf.validate.field).repeated.max_items = 64,
    (buf.validate.field).repeated.unique = true,
    (buf.validate.field).repeated.items.string.min_len = 1,
    (buf.validate.field).repeated.items.string.max_len = 128
  ];
  repeated string resource_ids = 3 [
    (buf.validate.field).repeated.max_items = 256,
    (buf.validate.field).repeated.unique = true,
    (buf.validate.field).repeated.items.string.min_len = 1,
    (buf.validate.field).repeated.items.string.max_len = 512
  ];
}

// StartTaskWorkContextRequest mints a Task capability for the caller. Its Session
// is the one the caller authenticated with — or a fresh one when it has none —
// assigned by the issuer and returned in IssuedWorkContext, never named by the
// caller: a session a caller could name is one it could name after another
// credential's, and a confined credential is paired with a capability on the
// session alone.
message StartTaskWorkContextRequest {
  reserved 3;
  reserved "session_id";
  string org_id = 1 [(buf.validate.field).string.uuid = true];
  // The runtime boundary the capability is minted under. Required on an
  // ordinary mint, where the caller owns the Task it names.
  //
  // FORBIDDEN on a solution-scoped mint. The host assigns each registered
  // solution one opaque boundary at registration and seals that one, so a
  // solution never chooses the boundary its runs are visible under and can
  // never name another solution's (issue #1015). Which of the two a request is
  // depends on the credential it carries, which no schema rule can see, so the
  // rule here is only "a UUID when present" and the handler refuses the wrong
  // shape on either path: an absent boundary on an ordinary mint, a named one
  // on a solution-scoped mint.
  string task_id = 2 [
    (buf.validate.field).string.uuid = true,
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE
  ];
  // Empty means a direct human-owned Task. Otherwise this must name an active,
  // registered agent Principal in org_id.
  string actor_principal_id = 4;
  repeated WorkContextScope authority_scopes = 5 [
    (buf.validate.field).repeated.min_items = 1,
    (buf.validate.field).repeated.max_items = 64
  ];
  string audience = 6 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 512
  ];
  WorkContextReplayPolicy replay_policy = 7;
  int32 ttl_seconds = 8 [
    (buf.validate.field).int32.gte = 0,
    (buf.validate.field).int32.lte = 900
  ];
  // Optional Codefly execution boundary. When set, consumers bind the
  // capability to this exact workspace and reject cross-workspace reuse.
  optional string workspace_id = 9 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 512
  ];
  // Optional product/project attribution inside workspace_id.
  optional string project_id = 10 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 512
  ];
}

// StartInstallationTaskRequest is the headless (no-user-present) mint path. The
// caller is a trusted internal service (a job consumer leasing an ingest job),
// not a bearer: owner := the installation's owner of record; actor := the agent
// principal; authority := the agent's standing scope grants ∩ its ceiling,
// resolved live. It fails closed when the agent is revoked/disabled, the standing
// grant is gone, or no owner/co-owner is currently an org admin.
//
// On this RPC each authority_scopes.resource_ids entry is a SCOPE NODE id (a data
// boundary, #473), NOT a product-record id — the mint resolves the boundary from
// that node's own row and checks the agent holds a standing grant at an
// ancestor-or-equal of it. This differs from CheckAccess, where resource_id is a
// placed-record id; do not pass a record id here.
//
// The Session is assigned by the issuer and returned in IssuedWorkContext, never
// named by the caller: a session a caller could name is one it could name after
// another credential's, and a confined credential is paired with a capability on
// the session alone.
message StartInstallationTaskRequest {
  reserved 4;
  reserved "session_id";
  string org_id = 1 [(buf.validate.field).string.uuid = true];
  string installation_id = 2 [(buf.validate.field).string.uuid = true];
  string task_id = 3 [(buf.validate.field).string.uuid = true];
  repeated WorkContextScope authority_scopes = 5 [
    (buf.validate.field).repeated.min_items = 1,
    (buf.validate.field).repeated.max_items = 64
  ];
  string audience = 6 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 512
  ];
  WorkContextReplayPolicy replay_policy = 7;
  int32 ttl_seconds = 8 [
    (buf.validate.field).int32.gte = 0,
    (buf.validate.field).int32.lte = 900
  ];
  optional string workspace_id = 9 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 512
  ];
  optional string project_id = 10 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 512
  ];
}

message StartRootSessionWorkContextRequest {
  string org_id = 1 [(buf.validate.field).string.uuid = true];
  string parent_work_context_token = 2 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 32768
  ];
  string session_id = 3 [(buf.validate.field).string.uuid = true];
  string audience = 4 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 512
  ];
  WorkContextReplayPolicy replay_policy = 5;
  int32 ttl_seconds = 6 [
    (buf.validate.field).int32.gte = 0,
    (buf.validate.field).int32.lte = 900
  ];
}

// ExchangeWorkContextAudienceRequest reissues the same immutable Task, owner,
// and delegation lineage for another service boundary while attenuating the
// effective authority to the requested scopes. The reissued capability opens the
// caller's own authenticated Session, assigned by the issuer.
message ExchangeWorkContextAudienceRequest {
  string org_id = 1 [(buf.validate.field).string.uuid = true];
  string parent_work_context_token = 2 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 32768
  ];
  string audience = 3 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 512
  ];
  repeated WorkContextScope attenuated_scopes = 4 [
    (buf.validate.field).repeated.min_items = 1,
    (buf.validate.field).repeated.max_items = 64
  ];
  WorkContextReplayPolicy replay_policy = 5;
  int32 ttl_seconds = 6 [
    (buf.validate.field).int32.gte = 0,
    (buf.validate.field).int32.lte = 900
  ];
}

// StartChildSessionWorkContextRequest delegates one more hop from a verified
// parent. The child Session is assigned by the issuer and returned in
// IssuedWorkContext (with the parent's as parent_session_id), never named by the
// caller: a session a caller could name is one it could name after another
// credential's, and a confined credential is paired with a capability on the
// session alone.
message StartChildSessionWorkContextRequest {
  reserved 3;
  reserved "session_id";
  string org_id = 1 [(buf.validate.field).string.uuid = true];
  string parent_work_context_token = 2 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 32768
  ];
  string actor_principal_id = 4 [(buf.validate.field).string.uuid = true];
  repeated WorkContextScope granted_scopes = 5 [
    (buf.validate.field).repeated.min_items = 1,
    (buf.validate.field).repeated.max_items = 64
  ];
  string audience = 6 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 512
  ];
  WorkContextReplayPolicy replay_policy = 7;
  int32 ttl_seconds = 8 [
    (buf.validate.field).int32.gte = 0,
    (buf.validate.field).int32.lte = 900
  ];
}

// RenewWorkContextRequest extends an in-flight delegated capability past the
// signing TTL cap without the originating user present. The caller is the
// current (outermost) actor of the parent context, not its owner, so a
// long-running delegated task can keep itself alive. Renewal preserves the
// Task, owner, and delegation lineage and opens a fresh Session assigned by the
// issuer; it may attenuate but can never widen the current actor's authority.
message RenewWorkContextRequest {
  string org_id = 1 [(buf.validate.field).string.uuid = true];
  string parent_work_context_token = 2 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 32768
  ];
  // Optional new audience. Empty keeps the parent context's audience, the
  // common renewal case where only the TTL is refreshed.
  optional string audience = 3 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 512
  ];
  // Optional narrowed scopes. Empty keeps the current actor's effective
  // authority unchanged; when present they must attenuate it.
  repeated WorkContextScope attenuated_scopes = 4 [
    (buf.validate.field).repeated.max_items = 64
  ];
  WorkContextReplayPolicy replay_policy = 5;
  int32 ttl_seconds = 6 [
    (buf.validate.field).int32.gte = 0,
    (buf.validate.field).int32.lte = 900
  ];
}

// IssuedWorkContext is the opaque signed capability plus safe correlation
// fields useful to an SDK caller. Consumers must verify the token rather than
// trusting these duplicated display fields.
message IssuedWorkContext {
  string token = 1;
  string org_id = 2;
  string owner_principal_id = 3;
  string task_id = 4;
  string session_id = 5;
  optional string parent_session_id = 6;
  string current_actor_principal_id = 7;
  uint64 authorization_revision = 8;
  google.protobuf.Timestamp expires_at = 9;
  optional string workspace_id = 10;
  optional string project_id = 11;
}

// WorkContextRevisionSubject is one owner or delegated actor whose current
// authority must still match the revision sealed into a signed Work Context.
message WorkContextRevisionSubject {
  string principal_id = 1 [(buf.validate.field).string.uuid = true];
  repeated WorkContextScope scopes = 2 [
    (buf.validate.field).repeated.max_items = 64
  ];
}

// CheckAuthorizationRevisionRequest contains only the immutable authority
// facts needed by a Work Context consumer. The signed capability itself never
// crosses this internal boundary.
message CheckAuthorizationRevisionRequest {
  string org_id = 1 [(buf.validate.field).string.uuid = true];
  string owner_principal_id = 2 [(buf.validate.field).string.uuid = true];
  uint64 authorization_revision = 3 [(buf.validate.field).uint64.gt = 0];
  repeated WorkContextRevisionSubject subjects = 4 [
    (buf.validate.field).repeated.min_items = 1,
    (buf.validate.field).repeated.max_items = 17
  ];
  // operation_binding_id is the operation binding the context sealed, copied
  // from its operation_binding.binding_id. A context minted from a source
  // delegation exercises one (the delegation, used by its actor), and is
  // confirmed only against that binding, re-read live; such a context checked
  // without it is not confirmed. Empty for a context that seals none.
  optional string operation_binding_id = 5 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 512
  ];
  // seals_no_binding ASSERTS that the context names no operation binding at
  // all. A consumer must send either this or operation_binding_id, and a
  // request carrying neither is refused as malformed rather than confirmed.
  //
  // The distinction is the whole point. The signed capability never crosses
  // this boundary (see above), so the host reads the binding from fields the
  // consumer copied out of it — and an OMITTED field and a context that
  // genuinely seals none are indistinguishable unless one of them is stated.
  // While they were, a consumer that simply forgot the binding had a narrowed
  // delegation confirmed against its module's much broader installation. Now
  // absence is something a consumer asserts, and forgetting is an error.
  optional bool seals_no_binding = 6;
}

// AuthorizeEvidenceReadRequest asks Accounts to authorize one filtered
// Evidence read using current membership and RBAC state. Empty optional
// filters describe a tenant-directory read and require unscoped evidence:read.
message AuthorizeEvidenceReadRequest {
  string org_id = 1 [(buf.validate.field).string.uuid = true];
  string caller_principal_id = 2 [(buf.validate.field).string.uuid = true];
  optional string owner_principal_id = 3 [(buf.validate.field).string.uuid = true];
  optional string task_id = 4 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 512
  ];
  optional string session_id = 5 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 512
  ];
}

// ConsumeSingleUseWorkContextRequest claims a SINGLE_USE Work Context exactly
// once. A consumer calls it after cryptographically verifying the capability;
// the first call for a context_id wins and every replay fails closed.
message ConsumeSingleUseWorkContextRequest {
  string org_id = 1 [(buf.validate.field).string.uuid = true];
  // context_id is the signed capability's own per-token nonce, read from the
  // verified Work Context. It is the replay-store key: unique per issuance,
  // stable across the consumer's own retries of the same token.
  string context_id = 2 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 512
  ];
  // expires_at is the capability's sealed expiry. The consumed marker is
  // retained until then and reclaimed by GC afterwards: once the token itself
  // is expired the verifier rejects it on time grounds, so the marker is moot.
  google.protobuf.Timestamp expires_at = 3 [(buf.validate.field).required = true];
}

// WorkContextService is owned by the permissions plugin. It turns current SaaS
// identity/RBAC facts into a short-lived Codefly Work Context; it does not own
// product Task or Session lifecycle storage.
service WorkContextService {
  // CheckAuthorizationRevision is the consumer-side revocation seam for a
  // previously issued Work Context. It succeeds only while every subject's
  // requested authority still resolves to the exact sealed revision.
  rpc CheckAuthorizationRevision(CheckAuthorizationRevisionRequest) returns (google.protobuf.Empty) {
  }

  // AuthorizeEvidenceRead is deliberately Evidence-specific. It prevents a
  // consumer from acquiring a generic Accounts permission oracle.
  rpc AuthorizeEvidenceRead(AuthorizeEvidenceReadRequest) returns (google.protobuf.Empty) {
  }

  // ConsumeSingleUse is the durable replay store behind the SINGLE_USE replay
  // policy. It records a context_id as consumed on first call and rejects every
  // later call for the same id, so a single-use capability is redeemable exactly
  // once across all consumers regardless of instance or retry.
  //
  // The redemption is deliberately not retry-safe: because the key is the token's
  // own stable id, a second call after a lost response is indistinguishable from
  // a replay and returns ALREADY_EXISTS. A caller must treat that as the
  // capability being spent and fail the operation closed, not retry it.
  rpc ConsumeSingleUse(ConsumeSingleUseWorkContextRequest) returns (google.protobuf.Empty) {
  }

  rpc StartTask(StartTaskWorkContextRequest) returns (IssuedWorkContext) {
    option (google.api.http) = {
      post: "/v1/work-contexts:task"
      body: "*"
    };
  }

  // StartInstallationTask is the headless mint. Unlike StartTask it opens with a
  // service credential rather than a bearer: it resolves the installation's owner
  // of record as the context owner and the installation's agent principal as the
  // sole actor, with authority drawn from the agent's standing scope grants
  // (intersected with its registered ceiling), resolved live. It records the same
  // durable actor-chain hop as every other mint and fails closed on a revoked or
  // disabled agent, a missing standing grant, or an installation with no
  // currently-admin owner or co-owner.
  rpc StartInstallationTask(StartInstallationTaskRequest) returns (IssuedWorkContext) {
  }

  rpc StartRootSession(StartRootSessionWorkContextRequest) returns (IssuedWorkContext) {
    option (google.api.http) = {
      post: "/v1/work-contexts:root-session"
      body: "*"
    };
  }

  // ExchangeAudience derives a least-privilege, audience-bound capability
  // without changing the Task, Session, owner, or delegation identity.
  rpc ExchangeAudience(ExchangeWorkContextAudienceRequest) returns (IssuedWorkContext) {
    option (google.api.http) = {
      post: "/v1/work-contexts:exchange-audience"
      body: "*"
    };
  }

  rpc StartChildSession(StartChildSessionWorkContextRequest) returns (IssuedWorkContext) {
    option (google.api.http) = {
      post: "/v1/work-contexts:child-session"
      body: "*"
    };
  }

  // RenewWorkContext is the actor-authorized exchange path. Unlike the
  // owner-bound RPCs, the caller is the current actor of the parent context,
  // letting a delegated task extend its own authority past the TTL cap while
  // the originating user is offline. Renewal re-resolves current authority and
  // fails closed on a stale revision or a revoked chain hop, and can only
  // attenuate the actor's scopes.
  rpc RenewWorkContext(RenewWorkContextRequest) returns (IssuedWorkContext) {
    option (google.api.http) = {
      post: "/v1/work-contexts:renew"
      body: "*"
    };
  }
}
