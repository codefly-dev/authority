syntax = "proto3";
// Extracted from the host (codefly-dev/module-saas-starter,
// saas/accounts/v1/module_registration.proto and module_capabilities.proto) on
// 2026-10-21 with messages, fields and field numbers unchanged. The host serves
// these two operations on its ModuleCapabilitiesService beside operations a
// module never calls; the interface carries only what a module relies on, under
// a service of its own.
package obin.authority.v1;

option go_package = "github.com/obin-ai/authority/gen/go/obin/authority/v1;authorityv1";

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";

// ModuleAuthorityService is what a module's workload calls on its host for its
// own authority: a Work Context for one of its declared bindings, and the
// installation a person-owned context is currently drawn through.
service ModuleAuthorityService {
  // MintModuleOperationContext issues the module's own Work Context for one
  // declared binding, bounded by manifest ∩ envelope at this tenant.
  rpc MintModuleOperationContext(ModuleMintOperationContextRequest) returns (ModuleMintOperationContextResponse);
  // GetCurrentInstallation resolves the installation a parent Work Context was
  // drawn through, so a module can place content under its root scope node.
  rpc GetCurrentInstallation(ModuleCurrentInstallationRequest) returns (ModuleCurrentInstallationResponse);
}

message ModuleMintOperationContextRequest {
  // Field 2 was the module's identity secret, deleted with the secret (#1056).
  reserved 2;
  reserved "secret";
  string prefix = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 63
    pattern: "^[a-z0-9](?:[a-z0-9-]*[a-z0-9])?$"
  }];
  string binding = 3 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];
  // service_account_token is the pod's projected ServiceAccount token, as on
  // ModuleMintWorkContextRequest.
  string service_account_token = 4 [(buf.validate.field).string = {
    min_len: 1
    max_len: 65536
  }];
  // Required for a shared principal with cross_tenant in its envelope. For a
  // tenant-pinned principal, omit or match its tenant. Accounts validates the
  // requested organization's live installation after authenticating execution.
  string organization_id = 5 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).string.uuid = true
  ];
}

message ModuleMintOperationContextResponse {
  string token = 1;
  google.protobuf.Timestamp expires_at = 2;
  string principal_id = 3;
  string tenant = 4;
  string audience = 5;
  string binding = 6;
}

message ModuleCurrentInstallationRequest {
 string parent_work_context_token = 1 [(buf.validate.field).string.min_len = 1, (buf.validate.field).string.max_len = 32768];
 string installation_id = 2 [(buf.validate.field).string.uuid = true];
}

message ModuleCurrentInstallationResponse {
 string installation_id = 1;
 string tenant_id = 2;
 // Was `solution_identifier`: the route alias. The host cannot answer it on a
 // request path — the alias lives on the host's presence state, and resolving
 // it here would mean joining every organisation's presence to answer about
 // one — and it is not an identity in any case, because a later binding may
 // take the same route. Reserved rather than reused so no caller reads an
 // identity out of a field that carried an alias.
 reserved 3;
 reserved "solution_identifier";
 // The immutable target this installation was consented to: one continuous
 // period of one binding's presence, never reused.
 string target_id = 4 [(buf.validate.field).string.uuid = true];
 // The delivered presence binding whose period that target records. This is
 // what an authority decision keys on; the alias is display only.
 string binding_id = 5;
}

