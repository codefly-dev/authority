kind: interface
publisher: codefly.dev
name: authority
description: What a module or solution calls on its host to be issued, checked and verified authority. Implemented by accounts and by the authority gateway.
version: 0.1.0
type: connect
protobuf:
    package: host.authority.v1
    services:
        - name: AuthorityService
          methods: [Issue, Check, Keys, ListResources, Delegate, RevokeDelegation, GetDelegation]
